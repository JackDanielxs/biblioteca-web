name: CI/CD Biblioteca Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Testes do backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes unitários
        run: mvn -B test -Dtest="*ControllerTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Teste de integração (@SpringBootTest) + cobertura JaCoCo
        run: mvn -B test
      - name: Publicar relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  test-frontend:
    name: Testes e build do frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run build

  # (extra) build das imagens + teste de aceitação com curl
  deploy:
    name: Build Docker + testes de aceitação
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Subir os containers
        run: docker compose up -d --build
      - name: Aguardar o backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/api/autores && break
            sleep 5
          done
      - name: Teste de aceitação - criar autor e livro vinculado
        run: |
          AUTOR_ID=$(curl -s -X POST http://localhost:8080/api/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          echo "Autor criado: $AUTOR_ID"
          curl -sf -X POST http://localhost:8080/api/livros \
            -H "Content-Type: application/json" \
            -d "{\"titulo\":\"Dom Casmurro\",\"anoPublicacao\":1899,\"autor\":{\"id\":$AUTOR_ID}}"
          curl -sf http://localhost:8080/api/livros/autor/$AUTOR_ID | grep "Dom Casmurro"
      - name: Derrubar os containers
        if: always()
        run: docker compose down -v
